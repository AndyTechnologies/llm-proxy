schema: spec-driven

context: |
  Tech stack: Bun.js v1.4.0 (runtime /home/andy/.bun/bin/bun); TypeScript strict
    (tsconfig strict, all src/*.ts). Bun native features (Bun.serve, Bun.spawn,
    Bun.file().yaml(), built-in .env, bun build --compile). Replaces Node + tsx.
  Architecture: LLM proxy orchestrating multi-model pipelines toward llama-swap/llama.cpp;
    OpenAI-compatible endpoints (/v1/chat/completions, /v1/completions, /v1/models).
  Testing: bun test (workspace test runner). Strict TDD active. Linter: eslint
    (lint script). Formatter: eslint --fix . Type checker: tsc --noEmit.
  Style: ESM TypeScript; strict typing required; eslint enforces semi + no-unused-vars.
  Migration note: active change migrates Node.js/Express/tsx to Bun native runtime
    and test suite; do NOT let the legacy Node-only description act as current context.

strict_tdd: true

testing:
  strict_tdd: true
  projects:
    - path: .
      stack: TypeScript strict on Bun.js 1.4.0
      test_command: bun test
      framework: bun:test (built-in)
      test_layers:
        unit: true
        integration: false
        e2e: false
      coverage: "bun test --coverage"
      quality:
        linter: "eslint . (via eslint.config.js)"
        type_checker: "tsc --noEmit"
        formatter: "eslint --fix . (via lint config)"
  note: >
    bun test is a single workspace-level command covering the single in-scope
    project (.); strict_tdd set to true. Downstream apply/verify must run tests
    through `bun test` from the workspace root.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (ESM TypeScript, strict)
      - Use Bun native features per migration (Bun.serve, Bun.spawn, Bun.file().yaml(), built-in .env)
    tdd: true
    test_command: bun test
  verify:
    test_command: bun test
    build_command: bun build src/index.ts --outdir dist
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
