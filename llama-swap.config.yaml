# healthCheckTimeout: number of seconds to wait for a model to be ready to serve requests
# - optional, default: 120
# - minimum value is 15 seconds, anything less will be set to this value
healthCheckTimeout: 500
logLevel: info

# globalTTL: the default TTL in seconds before unloading a model
# - optional, default: 0 (never automatically unload)
# - must be >= 0
globalTTL: 1800 # 1800 / 60 = 30 minutes

macros:
  "models_dir": "/home/andy/Models"
  "llama_server": "/home/andy/.local/bin/llama"
  "default_ngl": 99
  "flash_attn": "on"
  "kv_q4": "q4_0"
  "kv_q8": "q8_0"
  "lctx": 8192
  "lmctx": 16384
  "mctx": 32768
  "mhctx": 65536
  "hctx": 102400
  "args": |
    --port ${PORT}
    --parallel 1
    --n-gpu-layers ${default_ngl}
    --flash-attn ${flash_attn}
    --cache-type-k ${kv_q4}
    --cache-type-v ${kv_q4}
    -b 512
    -ub 512
    --host 127.0.0.1
    --tools all
  "general_temp": 0.4

max_tokens: 102400

models:
  "SmolLM3-3B":
    "macros":
      "temp": ${general_temp}
    cmd: |
      ${llama_server} serve ${args} 
        -n ${mhctx}
        -c ${mhctx}
        --model ${models_dir}/SmolLM3-3B-Q4_K_M.gguf
        
    name: "SmolLM3-3B"
    description: "SmolLM3 3B para tareas sencillas de pensamiento general"
    ttl: 600
    concurrencyLimit: 0
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    filters:
      setParams:
        temperature: ${temp}
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: ${mhctx}
      reasoning: true
    metadata:
      role: "explorer"
      phase: [explore, design-ingest]
      vram_estimate: "3.2 GB @ 32K"
      context: ${mhctx}
      max_tokens: ${hctx}
      reasoning: true

  "Llama3.2-3B-Instruct":
    "macros":
      "temp": ${general_temp}
    cmd: |
      ${llama_server} serve ${args} 
        -n ${hctx}
        -c ${hctx}
        --model ${models_dir}/Llama-3.2-3B-Instruct-Q4_K_M.gguf
        
    name: "Llama3.2-3B-Instruct"
    description: "Llama3.2 3B Instruct para tareas de pensamiento general."
    ttl: 600
    concurrencyLimit: 0
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    filters:
      setParams:
        temperature: ${temp}
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: ${hctx}
    metadata:
      context: ${hctx}
      max_tokens: ${hctx}

  "Qwen2.5-Coder-3B-Instruct":
    "macros":
      "temp": 0.6
    cmd: |
      ${llama_server} serve ${args} 
        -n ${mctx}
        -c ${mctx}
        --model ${models_dir}/Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf
        
    name: "Qwen2.5-Coder-3B-Instruct"
    description: "Qwen2.5 Coder 3B Instruct para tareas de programacion y pensamiento tecnico."
    ttl: 600
    concurrencyLimit: 0
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    filters:
      setParams:
        temperature: ${temp}
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: ${mctx}
    metadata:
      context: ${mctx}
      max_tokens: ${hctx}

  "Phi-4-Mini-Instruct":
    "macros":
      "temp": ${general_temp}
    cmd: |
      ${llama_server} serve ${args} 
        -n ${mctx}
        -c ${mctx}
        --model ${models_dir}/Phi-4-Mini-Instruct-Q4_K_M.gguf
        
    name: "Phi-4-Mini-Instruct"
    description: "Phi-4 Mini Instruct para tareas de general y abstracto."
    ttl: 600
    concurrencyLimit: 0
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    filters:
      setParams:
        temperature: ${temp}
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: ${mctx}
    metadata:
      context: ${mctx}
      max_tokens: ${hctx}
  