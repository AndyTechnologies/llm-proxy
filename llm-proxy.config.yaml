server:
  host: 127.0.0.1
  port: 8090
  corsOrigins: "*"
  jsonLimit: 10mb

# Managed llama-server backend — spawned and supervised by llm-proxy.
llama:
  binary: llama
  host: 127.0.0.1
  port: 8080
  autoStart: true
  startupTimeoutMs: 30000
  stopTimeoutMs: 5000
  requestTimeoutMs: 300000
  modelsDir: /home/andy/Models
  autoload: true
  router:
    ctx: 8192
    n: 2048
    nGpuLayers: -1
    flashAttn: true
    cacheTypeK: q4_0
    cacheTypeV: q4_0
    batch: 2048
    ubatch: 512
    tools: all
    parallel: 1
  models:
    SmolLM3-3B:
      file: SmolLM3-3B-Q4_K_M.gguf
      ctx: 65536
      temp: 0.1
    Llama3.2-3B-Instruct:
      file: Llama-3.2-3B-Instruct-Q4_K_M.gguf
      ctx: 102400
      temp: 0.1
    Qwen2.5-Coder-3B-Instruct:
      file: Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf
      ctx: 32768
      temp: 0.6
    Phi-4-Mini-Instruct:
      file: Phi-4-Mini-Instruct-Q4_K_M.gguf
      ctx: 32768
      temp: 0.1

defaultChain: orchestrator

chains:
  orchestrator:
    displayName: "Orchestrator"
    provider: llama-server
    steps:
      - name: generate
        type: generate
        model: SmolLM3-3B
      - name: refine-coder
        type: refine
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-phi
        type: refine
        model: Phi-4-Mini-Instruct
      - name: refine-llama
        type: refine
        model: Llama3.2-3B-Instruct

  thinker:
    displayName: "Thinker"
    provider: llama-server
    steps:
      - name: refine
        type: refine
        model: Phi-4-Mini-Instruct
      - name: generate
        type: generate
        model: Llama3.2-3B-Instruct

  coder:
    displayName: "Coder"
    provider: llama-server
    steps:
      - name: generate
        type: generate
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-phi
        type: refine
        model: Phi-4-Mini-Instruct
      - name: refine-coder
        type: refine
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-llama
        type: refine
        model: Llama3.2-3B-Instruct

  verifier:
    displayName: "Judge"
    provider: llama-server
    steps:
      - name: generate
        type: generate
        model: SmolLM3-3B
      - name: refine-coder
        type: refine
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-phi
        type: refine
        model: Phi-4-Mini-Instruct
      - name: refine-llama
        type: refine
        model: Llama3.2-3B-Instruct
