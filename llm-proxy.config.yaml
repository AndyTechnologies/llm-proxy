server:
  host: 127.0.0.1
  port: 8090
  corsOrigins: "*"
  jsonLimit: 10mb

llamaServer:
  host: 127.0.0.1
  port: 8080
  requestTimeoutMs: 300000

defaultChain: orchestrator

chains:
  orchestrator:
    displayName: "Orchestrator"
    provider: llama-server
    steps:
      - name: generate
        type: generate
        model: SmolLM3-3B
      - name: refine-coder
        type: refine
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-phi
        type: refine
        model: Phi-4-Mini-Instruct
      - name: refine-llama
        type: refine
        model: Llama3.2-3B-Instruct

  thinker:
    displayName: "Thinker"
    provider: llama-server
    steps:
      - name: refine
        type: refine
        model: Phi-4-Mini-Instruct
      - name: generate
        type: generate
        model: Llama3.2-3B-Instruct

  coder:
    displayName: "Coder"
    provider: llama-server
    steps:
      - name: generate
        type: generate
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-phi
        type: refine
        model: Phi-4-Mini-Instruct
      - name: refine-coder
        type: refine
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-llama
        type: refine
        model: Llama3.2-3B-Instruct

  verifier:
    displayName: "Judge"
    provider: llama-server
    steps:
      - name: generate
        type: generate
        model: SmolLM3-3B
      - name: refine-coder
        type: refine
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-phi
        type: refine
        model: Phi-4-Mini-Instruct
      - name: refine-llama
        type: refine
        model: Llama3.2-3B-Instruct
