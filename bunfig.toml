# Bun configuration.
#
# `bun test` (the `test` npm script) is scoped to `src/` so Playwright's E2E
# specs under `e2e/` (run via `bun run test:e2e`) are never picked up by the
# unit/integration runner. Unit tests live next to code under `src/`.
[test]
root = "./src"

# Svelte component-test infrastructure (Phase 3, task 3.7): bun cannot parse
# `.svelte`/`.svelte.js` natively, so a Bun.plugin preload compiles them with
# `svelte/compiler`, and a jsdom preload provides browser globals. Both are
# no-ops for the backend suites (no matching imports; extra globals unused).
# The leading "./" is required — bun resolves these relative to the project
# root only in that form.
preload = [
  "./src/ui-svelte/test-setup/svelte-loader.ts",
  "./src/ui-svelte/test-setup/dom.ts",
]