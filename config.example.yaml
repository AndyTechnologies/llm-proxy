# Gateway Configuration Example
#
# Copy this file to llm-proxy.config.yaml and adjust to your environment.
# Supported formats: YAML (.yaml, .yml) and JSON (.json).
# The CONFIG_FILE env var overrides the default path.

server:
  host: 127.0.0.1
  port: 8090
  corsOrigins: "*"
  jsonLimit: 10mb

# Managed llama-server backend — spawned and supervised by llm-proxy.
# The gateway owns the full lifecycle: spawn, health-check, restart, shutdown.
llama:
  # Path to the llama-server binary. Resolved via PATH if not absolute.
  binary: llama
  host: 127.0.0.1
  # 0 = dynamic ephemeral port (read from process output)
  port: 8080
  autoStart: true
  startupTimeoutMs: 30000
  stopTimeoutMs: 5000
  requestTimeoutMs: 300000
  # Backend lifecycle timing knobs (ms).
  healthPollIntervalMs: 1000
  portParseTimeoutMs: 5000
  backoffCapMs: 30000
  # Fail-fast restart cap: stop retrying after this many unexpected exits
  # (state:"error"); 0 = unlimited retries.
  maxRestartAttempts: 5
  # Directory containing GGUF model files (relative file paths resolve here).
  # Use a portable path such as ~/Models; resolve to your local model cache.
  modelsDir: ~/Models
  # false → --no-models-autoload (models loaded on-demand only)
  autoload: true
  # Global router args (llama.cpp serve flags).
  router:
    ctx: 8192
    n: 2048
    nGpuLayers: -1
    flashAttn: true
    cacheTypeK: q4_0
    cacheTypeV: q4_0
    batch: 2048
    ubatch: 512
    tools: all
    parallel: 1
  # Model registry — each key is the friendly id used by chains (step.model).
  # A preset INI is generated from this on every start.
  models:
    SmolLM3-3B:
      file: SmolLM3-3B-Q4_K_M.gguf
      ctx: 65536
      temp: 0.1
    Llama3.2-3B-Instruct:
      file: Llama-3.2-3B-Instruct-Q4_K_M.gguf
      ctx: 102400
      temp: 0.1
    Qwen2.5-Coder-3B-Instruct:
      file: Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf
      ctx: 32768
      temp: 0.6
    Phi-4-Mini-Instruct:
      file: Phi-4-Mini-Instruct-Q4_K_M.gguf
      ctx: 32768
      temp: 0.1

# Default chain invoked when no X-Chain-ID header is provided.
defaultChain: orchestrator

# Dashboard (Slice D)
# ----------------
# A static SPA is served at /ui — open a browser to http://<host>:<port>/ui to
# inspect pipelines/models/executions and build+validate+hot-apply pipeline
# graphs. The SPA talks to the /api/ui/* REST + SSE surface and is open even
# when BEARER_TOKEN protects the API.
#
# /api/ui/* endpoints
#   GET  /api/ui/pipelines                      → pipeline summaries
#   GET  /api/ui/models                         → merged registered + detected models
#   GET  /api/ui/executions?limit=N             → recent execution history (bounded)
#   POST /api/ui/pipelines/:id/validate         → validate a graph draft
#   POST /api/ui/apply                          → zod-validate + atomically apply config
#   POST /api/ui/executions/:id/steps/:node/retry → retry a failed llm_call step
#   GET  /api/ui/events                         → SSE live updates
#
# Model list semantics (/api/ui/models):
#   The list merges registered models from `llama.models` (loaded: true) with
#   `.gguf` files detected on disk in `llama.modelsDir` (loaded: false). On-disk
#   files are CANDIDATES ONLY — they are never auto-registered. To serve a
#   detected file, add it to `llama.models` and apply the config (via the
#   dashboard, which atomically persists and reloads).

# Chain definitions — virtual models invocable via "gateway/<name>" or X-Chain-ID.
# Each chain is an ordered list of steps executed sequentially.
#
# Step types:
#   generate  — seed with original user messages (optionally prepend system/assistant).
#   refine    — refeed previous step's output for verification/improvement.
#   passthrough — forward request to provider without transformation.
#
# Conditional routing:
#   on_429           — step name to execute when this step returns HTTP 429.
#   tool_calls_route — step name to execute when response contains tool_calls.
chains:
  orchestrator:
    displayName: "Orchestrator"
    provider: llama-server
    steps:
      - name: generate
        type: generate
        model: SmolLM3-3B
      - name: refine-coder
        type: refine
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-phi
        type: refine
        model: Phi-4-Mini-Instruct
      - name: refine-llama
        type: refine
        model: Llama3.2-3B-Instruct

  thinker:
    displayName: "Thinker"
    provider: llama-server
    steps:
      - name: refine
        type: refine
        model: Phi-4-Mini-Instruct
      - name: generate
        type: generate
        model: Llama3.2-3B-Instruct

  coder:
    displayName: "Coder"
    provider: llama-server
    steps:
      - name: generate
        type: generate
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-phi
        type: refine
        model: Phi-4-Mini-Instruct
      - name: refine-coder
        type: refine
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-llama
        type: refine
        model: Llama3.2-3B-Instruct

  verifier:
    displayName: "Judge"
    provider: llama-server
    steps:
      - name: generate
        type: generate
        model: SmolLM3-3B
      - name: refine-coder
        type: refine
        model: Qwen2.5-Coder-3B-Instruct
      - name: refine-phi
        type: refine
        model: Phi-4-Mini-Instruct
      - name: refine-llama
        type: refine
        model: Llama3.2-3B-Instruct

# Example: conditional routing (coverage for pipeline-orchestration scenarios)
#   fallback-demo — on_429 fallback when the primary step returns HTTP 429:
#     - name: primary
#       type: generate
#       model: SmolLM3-3B
#       on_429: fallback
#     - name: fallback
#       type: generate
#       model: Phi-4-Mini-Instruct
